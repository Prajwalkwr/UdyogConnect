name: Keep backend awake

# Render's free plan sleeps the backend after ~15 minutes without traffic, and the next visitor
# waits 30-60 seconds while it starts. A light health check every 10 minutes keeps it awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 -o /dev/null https://udyogconnect.onrender.com/api/health/status; then
              echo "Backend is awake"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Backend did not answer the health check"
