name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        env:
          CI: true
          # mongodb-memory-server's default MongoDB 5.0 build needs libssl1.1, which Ubuntu 24.04 runners lack.
          MONGOMS_VERSION: 7.0.14
          MONGOMS_DISTRO: ubuntu-22.04
        run: npm test -- --no-file-parallelism
