<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UdyogConnect | Local Business Marketplace</title>
    <meta name="description" content="UdyogConnect helps Nepalese small businesses gain digital visibility and connect with local customers." />
    <style>
      /* Immediate first paint before the JS bundle finishes downloading */
      html, body {
        margin: 0;
        min-height: 100%;
        background: #FDFBF7;
        color: #0B1A30;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #root { min-height: 100vh; }
      #boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #boot-splash .mark {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(135deg, #F2B71D, #D4A017);
        box-shadow: 0 10px 30px rgba(242, 183, 29, 0.35);
      }
      #boot-splash strong {
        font-size: 1.15rem;
        letter-spacing: -0.02em;
      }
      #boot-splash span {
        font-size: 0.85rem;
        color: #57657A;
      }
      #boot-splash .bar {
        width: 140px;
        height: 4px;
        border-radius: 999px;
        background: #F0EAD6;
        overflow: hidden;
      }
      #boot-splash .bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #F2B71D;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <div class="mark" aria-hidden="true"></div>
        <strong>UdyogConnect</strong>
        <span>Loading your local marketplace…</span>
        <div class="bar" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
