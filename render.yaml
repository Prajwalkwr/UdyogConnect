# Render deployment manifest (example). Connect this repo in Render and adjust service settings in the dashboard.

services:
  - type: web
    name: udyogconnect-server
    env: node
    plan: free
    repo: https://github.com/Prajwalkwr/UdyogConnect
    branch: main
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    autoDeploy: true
    envVars:
      # Public website address used in password reset emails (not a secret).
      - key: FRONTEND_URL
        value: https://udyog-connect-lyart.vercel.app
    # Add sensitive env vars (MONGODB_URI, JWT_SECRET, BREVO_API_KEY, EMAIL_FROM, OPENAI_API_KEY, etc.)
    # in the Render dashboard, not here. The free plan blocks SMTP, so Gmail SMTP cannot send from Render.

  - type: static
    name: udyogconnect-client
    env: static
    plan: free
    repo: https://github.com/Prajwalkwr/UdyogConnect
    branch: main
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    autoDeploy: true
